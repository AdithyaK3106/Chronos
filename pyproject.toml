[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronos-agent"
version = "0.3.0"
description = "Bi-temporal repository intelligence and deterministic multi-agent governance on OpenHands SDK"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Chronos Contributors" }
]
requires-python = ">=3.12"
# Core install: hooks, MCP server, indexer, resolver, firewall, memory, dashboard.
# Deliberately free of OpenHands/LiteLLM (about 2 GB); those live in the [agent] extra.
dependencies = [
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-bash>=0.25.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "fastmcp>=3.2.0,<4",
]

[project.optional-dependencies]
# `chronos run` (headless OpenHands agent) and the AgyLLM provider
agent = [
    "openhands-sdk>=1.58.2",
    "openhands-tools>=1.58.2",
]
# `chronos-bench` paired benchmarks (drive OpenHands agents)
bench = [
    "openhands-sdk>=1.58.2",
    "openhands-tools>=1.58.2",
]
kuzu = ["kuzu>=0.11.0"]
test = ["pytest>=8.0"]
all = [
    "openhands-sdk>=1.58.2",
    "openhands-tools>=1.58.2",
    "kuzu>=0.11.0",
]

[project.scripts]
chronos = "chronos.cli.main:main"
chronos-bench = "chronos.cli.main:bench_main"

[tool.hatch.build.targets.wheel]
packages = ["chronos", "runtime", "benchmarks"]
# Local benchmark results are not part of the package (only the harness and suites are).
exclude = [
    "benchmarks/runs",
    "benchmarks/reports",
    "benchmarks/diffs",
    "benchmarks/data",
    "benchmarks/suites/*/acceptance/*/reference",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
