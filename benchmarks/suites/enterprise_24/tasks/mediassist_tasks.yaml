tasks:
  - id: "mediassist_task_01"
    repository_id: "mediassist"
    suite: "efficacy"
    category: "bug_fix"
    prompt: "Fix false positive regex trigger where benign chest pain descriptions trigger immediate cardiac emergency veto in src/safety/emergency_rules.py."
    target_files:
      - "src/safety/emergency_rules.py"
    verification_commands:
      - "pytest tests/test_safety.py -q"
    regression_commands:
      - "pytest tests/test_safety.py -q"
    timeout_seconds: 180

  - id: "mediassist_task_02"
    repository_id: "mediassist"
    suite: "efficacy"
