[project]
name = "chronos"
version = "0.1.0"
description = "Bi-temporal AST knowledge graph for AI coding agents"
requires-python = ">=3.10"
dependencies = [
    "graphiti-core[kuzu]>=0.29",
    "mcp>=1.2",
]

[project.scripts]
chronos = "chronos.cli:main"
chronos-mcp = "chronos.server:main"
chronos-ledger-mcp = "chronos.wedge3_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chronos"]

# ponytail: the suites are plain asserts with their own __main__, not pytest
# cases. This only teaches pytest to collect them; `python tests/test_x.py`
# still works and stays the documented way to run them.
[tool.pytest.ini_options]
testpaths = ["tests"]
