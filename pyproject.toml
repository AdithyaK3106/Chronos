[project]
name = "chronos"
version = "0.1.0"
description = "Bi-temporal AST knowledge graph for AI coding agents"
requires-python = ">=3.10"
dependencies = [
    "graphiti-core[kuzu]>=0.29",
    "mcp>=1.2",
    "litellm>=1.50",
]

[project.scripts]
chronos = "chronos.cli:main"
# The entry point. One server, every tool from all four wedges.
chronos-mcp = "chronos.server:main"
# Deprecated aliases -- all start the same unified server, with a notice on
# stderr. Kept so existing agent configs do not break on upgrade.
chronos-graph-mcp = "chronos.legacy_entry:graph"
chronos-ledger-mcp = "chronos.legacy_entry:ledger"
chronos-playbook-mcp = "chronos.legacy_entry:playbook"
chronos-enforce-mcp = "chronos.legacy_entry:enforce"

# Automatic Wedge 2 failure capture. Installing chronos into a partner repo
# registers the plugin with pytest — no conftest.py needed on their side.
# Opt out with CHRONOS_CAPTURE=0.
[project.entry-points."pytest11"]
chronos = "chronos.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chronos"]

# ponytail: the suites are plain asserts with their own __main__, not pytest
# cases. This only teaches pytest to collect them; `python tests/test_x.py`
# still works and stays the documented way to run them.
[tool.pytest.ini_options]
testpaths = ["tests"]
