# Memory A/B (4 Nov 2026). Each task exists three times with the same prompt: `_mem` starts with one
# relevant repository memory (as a teammate or an earlier session would have saved it with
# chronos_remember), `_forced` injects that memory even when recall would not pick it,
# `_nomem` starts with an empty memory store. Only the Chronos (treatment) arm is run.
# Every house rule is used correctly somewhere in the existing code, so it can be discovered
# without memory; the hidden acceptance test only passes if the rule is followed.
tasks:
- id: memory_gen_mem
  repository_id: shopkit
  suite: efficacy
  category: feature
  prompt: Add an optional timeout (in seconds, default 10) to the API client's get_order call.
  target_files: &id001
  - spec/api.yaml
  - shopkit/api_client.py
  verification_commands:
  - pytest tests -q
  regression_commands: []
  acceptance_tests:
  - acceptance/shopkit/test_mem_gen.py
  timeout_seconds: 240
  metadata:
    tools:
    - terminal
    seed_memories:
    - 'shopkit/api_client.py is generated from spec/api.yaml by `python tools/gen_client.py`. Never edit api_client.py by hand: change the spec (keyword arguments go under `options:`) and regenerate.'
    pair: gen
    variant: mem
- acceptance_tests:
  - acceptance/shopkit/test_mem_gen.py
  category: feature
  id: memory_gen_forced
  metadata:
    pair: gen
    seed_memories:
    - 'shopkit/api_client.py is generated from spec/api.yaml by `python tools/gen_client.py`. Never edit api_client.py by hand: change the spec (keyword arguments go under `options:`) and regenerate.'
    tools:
    - terminal
    variant: forced
    force_memories: true
  prompt: Add an optional timeout (in seconds, default 10) to the API client's get_order call.
  regression_commands: []
  repository_id: shopkit
  suite: efficacy
  target_files:
  - spec/api.yaml
  - shopkit/api_client.py
  timeout_seconds: 240
  verification_commands:
  - pytest tests -q
- id: memory_gen_nomem
  repository_id: shopkit
  suite: efficacy
  category: feature
  prompt: Add an optional timeout (in seconds, default 10) to the API client's get_order call.
  target_files: *id001
  verification_commands:
  - pytest tests -q
  regression_commands: []
  acceptance_tests:
  - acceptance/shopkit/test_mem_gen.py
  timeout_seconds: 240
  metadata:
    tools:
    - terminal
    seed_memories: []
    pair: gen
    variant: nomem
